server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip para los chunks de Vite
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    gzip_min_length 1024;

    # Cache agresivo para los assets con hash en el nombre (vendor-react.js, etc.)
    location ~* \.(js|css|woff2?|png|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Fallback a index.html para React Router (HashRouter no lo necesita
    # pero por si acaso se usa BrowserRouter en el futuro)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
