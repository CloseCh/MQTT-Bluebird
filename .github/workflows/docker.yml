name: Docker

# Publica la imagen Docker de la versión web (nginx) en GitHub Container
# Registry (ghcr.io). Se dispara cuando se publica un Release (lo crea el
# workflow `release.yml`), tomando la versión del tag (vX.Y.Z), o a mano.
on:
  release:
    types: [published]
  workflow_dispatch:

env:
  # ghcr.io/<owner>/<repo> en minúsculas; metadata-action ya lo normaliza.
  IMAGE_NAME: ghcr.io/${{ github.repository }}

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Genera tags y labels OCI a partir del evento: en un release etiqueta
      # con la versión (0.1.0), major.minor (0.1) y `latest`; en dispatch usa
      # el nombre de la rama.
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
